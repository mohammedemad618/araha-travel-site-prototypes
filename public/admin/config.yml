    summary: '{{fields.title.ar}}'
    fields:
    - label: عنوان اليوم
      name: title
      widget: object
      fields:
      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
    - label: تفاصيل اليوم
      name: description
      widget: object
      fields:
      - label: العربية
        name: ar
        widget: text
      - label: English
        name: en
        widget: text
    - label: وسوم
