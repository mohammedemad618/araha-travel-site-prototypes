# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
# Every change made in /admin is committed to the GitHub repository, which
# triggers a new Netlify build. Invalid content fails the build, so the live
# site keeps the previous version until the mistake is fixed.

backend:
  name: github
  repo: mohammedemad618/araha-travel-site-prototypes
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: 'CMS: add {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload "{{path}}"'
    deleteMedia: 'CMS: delete "{{path}}"'
local_backend: true
locale: ar
media_folder: public/uploads
public_folder: /uploads
site_url: https://araha-travel.netlify.app
display_url: https://araha-travel.netlify.app
collections:
- name: packages
  label: الباقات
  label_singular: باقة
  folder: content/packages
  extension: json
  format: json
  create: true
  delete: true
