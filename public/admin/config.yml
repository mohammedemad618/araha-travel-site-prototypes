      value: adventure
    - label: استكشاف
      value: discovery
    - label: عائلية
      value: family
    - label: رومانسية
      value: romance
    - label: استرخاء
      value: unwind
    - label: فاخرة
      value: luxury
  - label: عدد الأيام
    name: days
    widget: number
    value_type: int
    min: 1
  - label: عدد الليالي
    name: nights
    widget: number
    value_type: int
    min: 0
  - label: السعر ابتداءً من (دينار عراقي، للشخص)
    name: price
    widget: number
    value_type: int
    min: 1
  - label: 'أساس السعر (مثل: للشخص في غرفة مزدوجة)'
    name: priceNote
    widget: object
    fields:
    - label: العربية
      name: ar
      widget: string
    - label: English
      name: en
      widget: string
  - label: سعر الطفل ابتداءً من (اختياري)
    name: childPrice
    widget: number
    value_type: int
    min: 0
    required: false
  - label: السعر ساري حتى (اختياري)
    name: priceValidUntil
    required: false
    widget: datetime
    format: YYYY-MM-DD
    date_format: YYYY-MM-DD
    time_format: false
  - label: أبرز المميزات (تظهر على البطاقة)
    name: highlights
    widget: list
    summary: '{{fields.ar}}'
    fields:
    - label: العربية
      name: ar
      widget: string
    - label: English
      name: en
      widget: string
    min: 1
  - label: المقدمة
    name: lead
    widget: object
    fields:
    - label: العربية
      name: ar
      widget: text
    - label: English
      name: en
      widget: text
  - label: نبذة عن الرحلة
    name: overview
    widget: object
    fields:
    - label: العربية
      name: ar
      widget: text
    - label: English
      name: en
      widget: text
  - label: معلومات الرحلة
    name: facts
    widget: object
    fields:
    - label: المسار
      name: route
      widget: object
      fields:
      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
    - label: الإقامة
      name: stay
      widget: object
      fields:
      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
    - label: الطيران
