      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
    - label: اسم المصوّر (اختياري)
      name: credit
      widget: string
      required: false
    - label: رابط المصوّر (اختياري)
      name: creditUrl
