# Decap CMS configuration — https://decapcms.org/docs/configuration-options/
# Edits are saved as pull requests (editorial workflow): Netlify builds a
# preview and CI runs the tests before anything reaches the live site.
# Invalid content fails the build, so the live site keeps the previous version.
#
# Keep this file in sync with lib/schema.ts.

# Run `npx decap-server` next to `npm run dev` to edit content locally.
backend:
  name: github
  repo: mohammedemad618/araha-travel-site-prototypes
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  commit_messages:
    create: 'CMS: add {{collection}} "{{slug}}"'
    update: 'CMS: update {{collection}} "{{slug}}"'
    delete: 'CMS: delete {{collection}} "{{slug}}"'
    uploadMedia: 'CMS: upload "{{path}}"'
    deleteMedia: 'CMS: delete "{{path}}"'
publish_mode: editorial_workflow
local_backend: true
locale: ar
media_folder: public/uploads
public_folder: /uploads
site_url: https://araha-travel.netlify.app
display_url: https://araha-travel.netlify.app
collections:
- name: packages
  label: الباقات
  label_singular: باقة
  folder: content/packages
  extension: json
  format: json
  create: true
  delete: true
  slug: '{{fields.slug}}'
  identifier_field: slug
  summary: '{{title.ar}} — {{price}} د.ع'
  sortable_fields:
  - order
  - price
  - days
  fields:
  - label: المعرّف في الرابط (إنجليزي، أحرف صغيرة وشرطات)
    name: slug
    widget: string
    pattern:
    - ^[a-z0-9-]+$
    - أحرف إنجليزية صغيرة وأرقام وشرطات فقط
    hint: يجب أن يطابق اسم الملف. لا تغيّره بعد النشر حتى لا تتعطل الروابط.
  - label: اسم الباقة
    name: title
    widget: object
    fields:
    - label: العربية
      name: ar
      widget: string
    - label: English
      name: en
      widget: string
  - label: الوجهة
    name: destination
    widget: relation
    collection: destinations
    value_field: slug
    search_fields:
    - slug
    - name.ar
    display_fields:
    - name.ar
  - label: أسلوب الرحلة
    name: styles
    widget: select
    multiple: true
    min: 1
    options:
