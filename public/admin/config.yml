      fields:
      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
    - label: المجموعة
      name: group
      widget: object
      fields:
      - label: العربية
        name: ar
        widget: string
      - label: English
        name: en
        widget: string
  - label: الصورة الرئيسية
    name: image
    widget: object
    fields:
    - label: الصورة
      name: src
      widget: image
      choose_url: true
      pattern:
      - ^(/uploads/[^?#\s]+|https://images\.unsplash\.com/photo-[\w-]+(\?\S*)?)$
      - ارفع الصورة، أو استخدم رابطاً يبدأ بـ https://images.unsplash.com/photo-
    - label: وصف الصورة (للمكفوفين ومحركات البحث)
      name: alt
      widget: object
