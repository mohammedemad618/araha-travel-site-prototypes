        widget: string
      - label: English
        name: en
        widget: string
      required: false
  - label: يشمل العرض
    name: includes
    widget: list
    summary: '{{fields.ar}}'
    fields:
    - label: العربية
      name: ar
      widget: string
    - label: English
      name: en
      widget: string
