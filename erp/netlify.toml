# Netlify configuration for the Niura ERP (deployed as its own Netlify site
# with base directory "erp"). Needs MONGODB_URI in the site's environment.

[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build when nothing inside erp/ changed.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"
