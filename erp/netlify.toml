# Netlify configuration for the Niura ERP (deployed as its own Netlify site
# with base directory "erp"). Needs MONGODB_URI in the site's environment.

[build]
  command = "npm run build"
  publish = ".next"
  # Skip the build when nothing inside erp/ changed. A rebuild of the same
  # commit always runs (Netlify sets CACHED_COMMIT_REF to the current commit
  # when there is no build cache, and comparing it with itself would skip).
  ignore = "[ \"$CACHED_COMMIT_REF\" != \"$COMMIT_REF\" ] && git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

[build.environment]
  NODE_VERSION = "22"
  NEXT_TELEMETRY_DISABLED = "1"

# The Next.js runtime (server pages, API routes, middleware) on Netlify Functions.
[[plugins]]
  package = "@netlify/plugin-nextjs"
